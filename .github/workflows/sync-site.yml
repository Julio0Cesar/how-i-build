name: Sync site

# Not `release: published`. release-please publishes with GITHUB_TOKEN, and
# GitHub does not start workflows from events that token creates — the same
# property that keeps the release workflow from looping on its own commit. The
# sync silently never ran because of it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # The two-branch model is optional. A fork that never creates `site`
      # should not see a failing workflow on every release.
      - name: Look for a site branch
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/branches/site" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No site branch in this repository — nothing to sync."
          fi

      - uses: actions/checkout@v7
        if: steps.probe.outputs.exists == 'true'
        with:
          ref: site
          fetch-depth: 0

      # A real merge, not a squash: squashing would leave git believing `site`
      # never received these commits, and the next sync would replay them as
      # conflicts against content that is already there.
      - name: Merge main into site
        if: steps.probe.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reads the `merge=ours` attributes in `.gitattributes`. Without the
          # driver git knows the name and has nothing to run for it.
          git config merge.ours.driver true
          git fetch origin main
          git merge --no-ff origin/main -m "chore: merge main into site"
          git push origin site
